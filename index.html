<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>OpenAnime - Streaming Anime-Sama sans pub & Cast TV</title>
    <meta name="description" content="Lecteur d'anime épuré pour Anime-Sama avec sélection automatique des lecteurs, lecture enchaînée des saisons et diffusion Chromecast vers TV sans popups ni publicités." />
    <meta property="og:title" content="OpenAnime - Streaming Anime-Sama sans pub & Cast TV" />
    <meta property="og:description" content="Lecteur d'anime épuré pour Anime-Sama avec sélection automatique des lecteurs, lecture enchaînée des saisons et diffusion Chromecast vers TV sans popups ni publicités." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA & Mobile Web Capabilities (Optimisé Google Pixel 8 & Android) -->
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpenAnime" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <!-- Style critique pré-chargement pour éliminer tout écran blanc -->
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        background-color: #020617 !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      #root:empty::before {
        content: '';
        width: 36px;
        height: 36px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #root:empty::after {
        content: 'Chargement d\'OpenAnime...';
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: #94a3b8;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <script>
      // Redirection automatique si accédé sur GitHub Pages sans le slash terminal
      if (window.location.hostname.includes('github.io') && window.location.pathname === '/OpenAnime') {
        window.location.replace('/OpenAnime/' + window.location.search + window.location.hash);
      }
    </script>

    <!-- Google Cast Web Sender SDK (Asynchrone non-bloquant) -->
    <script async src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
