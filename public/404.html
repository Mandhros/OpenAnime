<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenAnime</title>
    <style>
      body {
        background-color: #020617;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }
      .loader {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Redirection intelligente pour GitHub Pages SPA
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      // Si hébergé sous un sous-dossier comme /OpenAnime/
      const repoBase = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
      window.location.replace(repoBase);
    </script>
  </head>
  <body>
    <div class="loader"></div>
    <p>Redirection vers OpenAnime...</p>
  </body>
</html>
